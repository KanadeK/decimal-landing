[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decimal-landing"
version = "0.1.0"
description = "Exact decimal CSV conversion with explicit rounding and loss budgets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KanadeK"}]
dependencies = []
keywords = ["csv", "data-migration", "cli", "offline"]

[project.scripts]
decimal-landing = "decimal_landing.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/decimal-landing"
Issues = "https://github.com/KanadeK/decimal-landing/issues"

[tool.setuptools]
packages = ["decimal_landing"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
